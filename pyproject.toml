[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-control-api"
version = "0.1.0"
description = "FastAPI backend for Hermes Mission Control TUI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "websockets>=15.0,<16",
    "psutil>=6.1.0,<7",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.10.0,<3",
    "python-multipart>=0.0.17,<1",
    "httpx>=0.28.1,<1",
    "hindsight-client>=0.1.8,<1",
    "PyYAML>=6.0.2,<7",
    "aiosqlite>=0.20.0,<1",
    "python-dotenv>=1.2.1,<2",
    "aiofiles>=24.1.0,<25",
    "croniter>=6.0.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov>=6.0.0,<7",
    "black>=24.10.0,<26",
    "ruff>=0.8.0,<1",
    "mypy>=1.13.0,<2",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*", "tests*"]
