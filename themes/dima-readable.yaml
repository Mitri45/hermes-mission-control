name: dima-readable
label: Dima Readable
description: Clean system fonts, normal tracking, less Nous sci-fi nonsense.

palette:
  background:
    hex: "#0e0f12"
    alpha: 1
  midground:
    hex: "#e8e8e8"
    alpha: 1
  foreground:
    hex: "#ffffff"
    alpha: 0
  warmGlow: "rgba(80, 120, 255, 0.12)"
  noiseOpacity: 0.25

typography:
  fontSans: "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  fontMono: "'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace"
  fontDisplay: "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  baseSize: "15px"
  lineHeight: "1.55"
  letterSpacing: "0"

layout:
  radius: "0.625rem"
  density: comfortable

colorOverrides:
  card: "#15171c"
  cardForeground: "#eeeeee"
  popover: "#15171c"
  popoverForeground: "#eeeeee"
  primary: "#e8e8e8"
  primaryForeground: "#0e0f12"
  secondary: "#20232a"
  secondaryForeground: "#eeeeee"
  muted: "#20232a"
  mutedForeground: "#a8adb8"
  accent: "#252a34"
  accentForeground: "#ffffff"
  border: "rgba(255, 255, 255, 0.14)"
  input: "rgba(255, 255, 255, 0.16)"
  ring: "#8aa4ff"
  success: "#4ade80"
  warning: "#fbbf24"
  destructive: "#fb7185"

customCSS: |
  /* Kill decorative Nous fonts in the dashboard shell. Branding fonts are not UI fonts. */
  html body,
  html body *:not(svg):not(path) {
    font-family: var(--theme-font-sans) !important;
    letter-spacing: normal !important;
  }

  html code,
  html pre,
  html kbd,
  html samp,
  html .font-mono,
  html .font-mono-ui,
  html .font-courier,
  html textarea,
  html input[type="text"],
  html input[type="search"],
  html input[type="password"] {
    font-family: var(--theme-font-mono) !important;
  }

  html h1,
  html h2,
  html h3,
  html h4,
  html h5,
  html h6,
  html .font-expanded,
  html .font-compressed,
  html .font-mondwest {
    font-family: var(--theme-font-sans) !important;
    letter-spacing: -0.01em !important;
    text-transform: none !important;
  }

  html button,
  html button.font-mono,
  html button.font-courier,
  html label,
  html [role="button"],
  html [role="button"].font-mono,
  html [role="tab"],
  html nav,
  html aside {
    font-family: var(--theme-font-sans) !important;
    letter-spacing: normal !important;
    text-transform: none !important;
  }

  html input,
  html textarea,
  html select {
    font-size: 0.95rem !important;
    line-height: 1.4 !important;
  }
